<style>

.wr-safe { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; font-weight: 700; font-size: 13px; }
.wr-awards { display: flex; flex-direction: column; gap: 6px; width: 100%; text-align: left; }
.wr-awards div { background: rgba(0,0,0,.22); border-radius: 12px; padding: 7px 10px; font-size: 13px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
.wr-awards .n { margin-left: auto; font-family: var(--display); font-weight: 400; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="glow-bg" aria-hidden="true"><div class="spot a"></div><div class="spot b"></div><div class="spot c"></div></div>
<div id="app"><div class="boot">Encendiendo la bola de discoteca…</div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="off" hidden>Sin conexión… reintentando</div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="modal" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function () {
  var ALC = [
    { k: 'cana', e: '🍺', n: 'Cerveza' },
    { k: 'copa', e: '🍹', n: 'Copa' },
    { k: 'chupito', e: '🥃', n: 'Chupito' },
    { k: 'vino', e: '🍷', n: 'Vino' }
  ];
  var EXTRA = [
    { k: 'agua', e: '💧', n: 'Agua' },
    { k: 'vomito', e: '🤮', n: 'Vómito' }
  ];
  var KINDS = ALC.concat(EXTRA);
  var AVATARS = ['🕺', '💃', '🦄', '🐸', '🤠', '😎', '🥳', '🦖', '🐙', '🤡', '👽', '🍕'];
  var LEVELS = [[0, 'Sobrio (sospechosamente)'], [1, 'Calentando motores'], [3, 'Ya se ríe de todo'], [5, 'Baila sin música'], [7, 'Le escribe a su ex'], [10, 'Leyenda. Que alguien le dé agua']];
  var LS = 'copometro.v2';

  var $app = document.getElementById('app');
  var S = {
    prof: { pid: '', name: '', emoji: '🕺', ig: '' },
    code: '', d: null, tab: 'beber', view: 'boot', inviteCode: '', inviteName: '',
    reto: { to: '', kind: 'chupito', range: 10, pick: 0 },
    err: '', inflight: 0, seen: null, timer: null, fails: 0, last: '',
    wrap: { open: false, i: 0, c: -1 }, confirmFinish: false, lastFinished: null
  };

  /* ---------- utils ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function load() { try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) { return {}; } }
  function save(o) { try { var c = load(); for (var k in o) c[k] = o[k]; localStorage.setItem(LS, JSON.stringify(c)); } catch (e) {} }
  function rid(n) { var a = 'abcdefghijklmnopqrstuvwxyz0123456789', s = ''; for (var i = 0; i < n; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }
  function cleanIg(v) { v = String(v || '').trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i, '').replace(/^@/, '').split(/[/?#]/)[0]; return v.replace(/[^A-Za-z0-9._]/g, '').slice(0, 30); }
  function total(d) { var t = 0; ALC.forEach(function (k) { t += (d && d[k.k]) || 0; }); return t; }
  function levelOf(n) { var l = LEVELS[0][1]; LEVELS.forEach(function (x) { if (n >= x[0]) l = x[1]; }); return l; }
  function players() { return (S.d && S.d.players) || []; }
  function retos() { return (S.d && S.d.retos) || []; }
  function P(id) { return players().filter(function (p) { return p.id === id; })[0]; }
  function me() { return P(S.prof.pid); }
  function nm(id) { var p = P(id); return p ? p.name : '¿?'; }
  function avi(p) {
    if (!p) return '👤';
    if (p.ph > 0) return '<span class="avi"><img src="/photo/' + esc(S.code) + '/' + esc(p.id) + '?v=' + p.ph + '" alt=""></span>';
    return esc(p.emoji);
  }
  function em(id) { return avi(P(id)); }

  var PARTNERS = {
    ride: [{ n: '🚕 Uber', u: 'https://m.uber.com/ul/?action=setPickup&pickup=my_location' }, { n: '🚕 Cabify', u: 'https://cabify.com/es' }, { n: '🚕 Bolt', u: 'https://bolt.eu/es-es/' }],
    food: [{ n: '🍕 Glovo', u: 'https://glovoapp.com/es/es/' }, { n: '🍔 Uber Eats', u: 'https://www.ubereats.com/es' }]
  };
  function partnerLinks(list) { return list.map(function (p) { return '<a class="ghost pl" href="' + p.u + '" target="_blank" rel="noopener sponsored">' + p.n + '</a>'; }).join(''); }

  var $modal = document.getElementById('modal');
  function showModal(html) { $modal.innerHTML = '<div class="mback" data-act="mclose"></div><div class="mcard" role="dialog" aria-modal="true">' + html + '<button class="btn" data-act="mclose">Cerrar</button></div>'; $modal.hidden = false; }
  function closeModal() { $modal.hidden = true; $modal.innerHTML = ''; }
  $modal.addEventListener('click', function (e) { var b = e.target.closest('[data-act]'); if (b && b.dataset.act === 'mclose') closeModal(); });
  function privacyModal() {
    showModal('<h2>Privacidad</h2>' +
      '<p>Copómetro guarda solo lo que tú escribes: tu nombre, tu cara (emoji o foto), tu Instagram si lo pones y los tragos que apuntas.</p>' +
      '<p>Se usa únicamente para enseñar la fiesta a quienes están dentro, y se borra solo a los 30 días sin actividad. No vendemos tus datos.</p>' +
      '<p>Solo para mayores de 18 años. Puedes quitar tu foto o tu Instagram en cualquier momento desde «✏️ Yo».</p>' +
      '<p>Los enlaces de taxi y comida llevan a servicios externos con sus propias condiciones.</p>');
  }
  function qrModal() {
    var img;
    try { var q = qrcode(0, 'M'); q.addData(link()); q.make(); img = '<img class="qrimg" alt="Código QR para entrar a la fiesta" src="' + q.createDataURL(8, 4) + '">'; }
    catch (e) { img = '<div class="note">No se pudo generar el QR. Comparte este enlace.</div>'; }
    showModal('<h2>Escanea para entrar</h2>' + img + '<div class="codepill">' + esc(S.code) + '</div><div class="note">' + esc(link()) + '</div>');
  }

  function handlePhoto(file) {
    if (!file) return;
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var size = 160, c = document.createElement('canvas'); c.width = c.height = size;
      var x = c.getContext('2d'), s = Math.min(img.width, img.height);
      x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      var q = .7, d = c.toDataURL('image/jpeg', q);
      while (d.length > 22000 && q > .3) { q -= .1; d = c.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(url);
      S.prof.photo = d; S.prof.removePhoto = false; save({ prof: S.prof }); refreshPhoto();
    };
    img.onerror = function () { toast('No se pudo leer esa foto'); };
    img.src = url;
  }
  function refreshPhoto() {
    var p = document.getElementById('ph-prev'), r = document.getElementById('rm-ph');
    if (p) p.innerHTML = S.prof.photo ? '<span class="avi"><img src="' + S.prof.photo + '" alt=""></span>' : esc(S.prof.emoji);
    if (r) r.hidden = !S.prof.photo;
  }
  function link() { return location.origin + '/' + S.code; }
  function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('on'); }, 3400); }

  async function api(path, body) {
    var opt = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : undefined;
    var r = await fetch('/api/' + path, opt);
    var j = {}; try { j = await r.json(); } catch (e) {}
    if (!r.ok) { var er = new Error(j.error || 'Error'); er.status = r.status; throw er; }
    return j;
  }

  /* ---------- confetti ---------- */
  function confetti(emojis) {
    var c = document.getElementById('fx'), x = c.getContext('2d');
    c.width = innerWidth; c.height = innerHeight;
    var cols = ['#ff2e97', '#19e3ff', '#c8ff2e', '#ffd21f', '#fff'], ps = [];
    for (var i = 0; i < 80; i++) ps.push({ x: innerWidth / 2, y: innerHeight * 0.55, vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 4, r: Math.random() * 6, s: Math.random() * 8 + 5, c: cols[i % cols.length], e: emojis && i % 5 === 0 ? emojis[i % emojis.length] : null });
    var t0 = performance.now();
    (function f(t) {
      x.clearRect(0, 0, c.width, c.height);
      ps.forEach(function (p) {
        p.vy += .38; p.x += p.vx; p.y += p.vy; p.r += .2;
        if (p.e) { x.font = '26px serif'; x.fillText(p.e, p.x, p.y); }
        else { x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); }
      });
      if (t - t0 < 2600) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height);
    })(t0);
  }
  function burst(e) {
    var c = document.getElementById('fx'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
    var ps = [], i; for (i = 0; i < 10; i++) ps.push({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight - 120, vx: (Math.random() - .5) * 6, vy: -Math.random() * 9 - 6 });
    var t0 = performance.now();
    (function f(t) { x.clearRect(0, 0, c.width, c.height); ps.forEach(function (p) { p.vy += .35; p.x += p.vx; p.y += p.vy; x.font = '28px serif'; x.fillText(e, p.x, p.y); }); if (t - t0 < 1100) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height); })(t0);
  }

  /* ---------- profile / home views ---------- */
  function logo() { return '<div class="logo"><div class="ball"></div><h1>Copómetro</h1><div class="tag">Cuenta las copas, presume del ranking y paga los retos.</div></div>'; }
  function emojiRow() {
    return '<div><div class="note" style="margin-bottom:8px">Elige tu cara</div><div class="emojis">' + AVATARS.map(function (e) { return '<button class="emo" data-act="emoji" data-v="' + e + '" aria-pressed="' + (S.prof.emoji === e) + '">' + e + '</button>'; }).join('') + '</div></div>';
  }
  function photoRow() {
    return '<div><div class="note" style="margin-bottom:8px">Tu foto (opcional)</div><div class="ph-row"><div class="ph-prev" id="ph-prev">' +
      (S.prof.photo ? '<span class="avi"><img src="' + S.prof.photo + '" alt=""></span>' : esc(S.prof.emoji)) + '</div>' +
      '<label class="ghost filebtn">📷 Hacer foto<input id="in-cam" type="file" accept="image/*" capture="user" hidden></label>' +
      '<label class="ghost filebtn">🖼️ Galería<input id="in-gal" type="file" accept="image/*" hidden></label>' +
      '<button class="ghost" data-act="rmphoto" id="rm-ph"' + (S.prof.photo ? '' : ' hidden') + '>Quitar</button></div></div>';
  }
  function profFields(nameVal) {
    return '<label class="f" for="in-name">Tu nombre<input id="in-name" type="text" maxlength="18" placeholder="Ej: Lucas el Imparable" value="' + esc(nameVal) + '" autocomplete="off"></label>' + photoRow() + emojiRow() +
      '<label class="f" for="in-ig">Tu Instagram (opcional)<input id="in-ig" type="text" maxlength="40" placeholder="@tuusuario" value="' + esc(S.prof.ig ? '@' + S.prof.ig : '') + '" autocapitalize="none" autocomplete="off"></label>' +
      '<label class="chk"><input id="in-age" type="checkbox"' + (S.prof.adult ? ' checked' : '') + '><span>Tengo 18 años o más y me comprometo a beber con responsabilidad.</span></label>' +
      '<div class="note"><a href="#" data-act="privacy">Privacidad y datos</a></div>';
  }
  function homeView() {
    S.view = 'home';
    var resume = S.last ? '<div class="card"><div class="note">Tu última fiesta</div><h2>' + esc(S.last.name) + '</h2><button class="btn li" data-act="resume">Volver a la fiesta ' + esc(S.last.code) + '</button></div>' : '';
    $app.innerHTML = logo() + resume +
      '<div class="card"><h2>Monta una fiesta</h2>' + profFields(S.prof.name) +
      '<label class="f" for="in-party">Nombre de la fiesta<input id="in-party" type="text" maxlength="28" placeholder="Ej: Previa en casa de Marta" autocomplete="off"></label>' +
      '<button class="btn" data-act="create">🎉 Crear fiesta</button></div>' +
      '<div class="card"><h2>¿Te han pasado un código?</h2><label class="f" for="in-code">Código de la fiesta<input id="in-code" class="code" type="text" maxlength="4" placeholder="ABCD" autocapitalize="characters" autocomplete="off"></label>' +
      '<button class="btn cy" data-act="joincode">🚪 Entrar</button></div>' +
      '<div class="err" id="err">' + esc(S.err) + '</div><div class="note" style="text-align:center">Bebe con cabeza. Si has bebido, no conduzcas. 🚕</div>';
  }
  function inviteView() {
    S.view = 'invite';
    $app.innerHTML = logo() +
      '<div class="card"><div class="note">Te han invitado a</div><div class="invited">' + esc(S.inviteName) + '</div>' + profFields(S.prof.name) +
      '<button class="btn" data-act="acceptinvite">🎉 Entrar a la fiesta</button><div class="err" id="err">' + esc(S.err) + '</div></div>';
  }
  function editView() {
    S.view = 'edit';
    $app.innerHTML = '<div class="card"><h2>Tus datos</h2>' + profFields(S.prof.name) + '<button class="btn li" data-act="saveprof">Guardar</button><button class="ghost" data-act="cancel">Cancelar</button><div class="err" id="err">' + esc(S.err) + '</div></div>';
  }
  function setErr(m) { S.err = m; var e = document.getElementById('err'); if (e) e.textContent = m; }
  function readProf() {
    var g = function (id) { var el = document.getElementById(id); return el ? el.value : ''; };
    S.prof.name = g('in-name').trim(); S.prof.ig = cleanIg(g('in-ig'));
    var age = document.getElementById('in-age'); if (age) S.prof.adult = age.checked;
    if (!S.prof.pid) S.prof.pid = 'p' + rid(11);
    save({ prof: S.prof });
    return S.prof.name;
  }
  function profError() {
    if (!S.prof.name) return 'Ponte un nombre para salir en el ranking.';
    if (!S.prof.adult) return 'Tienes que confirmar que tienes 18 años o más.';
    return '';
  }
  function profBody(extra) {
    var b = { pid: S.prof.pid, name: S.prof.name, emoji: S.prof.emoji, ig: S.prof.ig, adult: true };
    if (S.prof.photo) b.photo = S.prof.photo; else if (S.prof.removePhoto) b.removePhoto = true;
    for (var k in extra) b[k] = extra[k];
    return b;
  }

  /* ---------- session ---------- */
  function startParty(view) {
    S.code = view.code; S.d = view; S.seen = null; S.tab = 'beber'; S.lastFinished = null; S.wrap = { open: false, i: 0, c: -1 }; S.reto = { to: '', kind: 'chupito', range: 10, pick: 0 }; S.view = 'party';
    save({ last: { code: view.code, name: view.name } });
    try { history.replaceState(null, '', '/' + view.code); } catch (e) {}
    seenUpdate(view, true); render(); poll();
  }
  async function createParty() {
    readProf(); var pe = profError(); if (pe) return setErr(pe);
    try { var v = await api('create', profBody({ party: document.getElementById('in-party').value })); startParty(v); }
    catch (e) { setErr(e.message || 'No se pudo crear la fiesta.'); }
  }
  async function joinCode(code) {
    try { var v = await api('p/' + code + '/join', profBody({})); startParty(v); }
    catch (e) { setErr(e.status === 404 ? 'No existe ninguna fiesta con ese código.' : (e.message || 'No se pudo entrar.')); }
  }
  function leave() {
    clearTimeout(S.timer); S.code = ''; S.d = null; S.timer = null;
    try { history.replaceState(null, '', '/'); } catch (e) {}
    load().last ? S.last = load().last : 0; homeView();
  }

  /* ---------- polling ---------- */
  function seenUpdate(v, first) {
    var res = {}; v.retos.forEach(function (r) { res[r.id] = r.status; });
    if (!first && S.seen) v.retos.forEach(function (r) {
      var prev = S.seen[r.id], meId = S.prof.pid;
      if (prev === 'pending' && r.status === 'resolved' && (r.from === meId || r.to === meId)) {
        if (r.match) { toast(r.to === meId ? '¡Coincidencia! Te toca beber 😈' : '¡' + nm(r.to) + ' ha fallado! Le toca beber 😈'); confetti(['🥃', '🍺', '😈']); }
        else toast(r.to === meId ? 'Reto fallado: te has librado 😮‍💨' : nm(r.to) + ' se ha librado');
      } else if (prev === undefined && r.status === 'pending' && r.to === meId) toast('🎲 ' + nm(r.from) + ' te ha retado');
    });
    S.seen = res;
  }
  function apply(v) {
    if (!v || v.same) return;
    if (S.inflight > 0) return;
    if (S.d && v.v === S.d.v) return;
    seenUpdate(v, false); S.d = v; render();
  }
  async function poll() {
    clearTimeout(S.timer);
    if (!S.code) return;
    var wait = document.hidden ? 5000 : 1500;
    try {
      var v = await api('p/' + S.code + '?pid=' + encodeURIComponent(S.prof.pid) + '&v=' + (S.d ? S.d.v : 0));
      S.fails = 0; document.getElementById('off').hidden = true; apply(v);
    } catch (e) {
      if (e.status === 404) { toast('Esa fiesta ya no existe'); return leave(); }
      S.fails++; if (S.fails >= 2) document.getElementById('off').hidden = false;
    }
    S.timer = setTimeout(poll, wait);
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.code) poll(); });

  /* ---------- actions ---------- */
  function addDrink(k, delta) {
    var m = me(); if (!m) return;
    var cur = m.drinks[k] || 0, nv = Math.max(0, cur + delta); if (nv === cur) return;
    m.drinks[k] = nv;
    var tn = total(m.drinks);
    if (delta > 0 && ALC.some(function (x) { return x.k === k; }) && (tn === 5 || tn === 8)) toast(tn === 8 ? '🚨 8 tragos: agua y taxi, ¿vale?' : '💧 5 tragos. Toca un vaso de agua.');
    if (delta > 0) burst(KINDS.filter(function (x) { return x.k === k; })[0].e);
    S.inflight++; render();
    var last = null;
    api('p/' + S.code + '/drink', { pid: S.prof.pid, k: k, delta: delta }).then(function (v) { last = v; }).catch(function () { toast('No se pudo guardar ese trago. Reintentando…'); })
      .then(function () { S.inflight--; if (S.inflight === 0) { if (last) { S.d = null; S.d = last; render(); } poll(); } });
  }
  async function act(path, body, okMsg) {
    S.inflight++;
    try { var v = await api('p/' + S.code + '/' + path, body); S.inflight--; seenUpdate(v, false); S.d = v; render(); if (okMsg) toast(okMsg); return true; }
    catch (e) { S.inflight--; toast(e.message || 'No se pudo. Prueba otra vez.'); poll(); return false; }
  }
  async function sendReto() {
    var r = S.reto; if (!r.to || !r.pick) return;
    var to = nm(r.to);
    if (await act('reto', { pid: S.prof.pid, to: r.to, kind: r.kind, range: r.range, pick: r.pick }, '🎲 Reto enviado a ' + to)) { S.reto.pick = 0; S.reto.to = ''; render(); }
  }

  /* ---------- party views ---------- */
  /* El medidor se mueve por puntos: agua baja, cerveza/vino suben, copa/chupito suben un poco mas, vomito sube mas */
  var W = { cana: 1, vino: 1, copa: 1.5, chupito: 1.5, vomito: 2.5, agua: -0.5 }, GAUGE_MAX = 20;
  function pts(d) { var t = 0; for (var k in W) t += ((d && d[k]) || 0) * W[k]; return Math.max(0, t); }
  var GL = [[0, 'Sobrios (sospechosamente)'], [0.06, 'Calentando motores'], [0.2, 'Ya se ríen de todo'], [0.35, 'Bailan sin música'], [0.55, 'Le escriben a su ex'], [0.8, 'Código rojo: agua y taxi']];
  function gaugeLabel(l) { var s = GL[0][1]; GL.forEach(function (x) { if (l >= x[0]) s = x[1]; }); return s; }
  function gauge() {
    var n = players().length || 1, sum = 0, cnt = 0; players().forEach(function (p) { sum += pts(p.drinks); cnt += total(p.drinks); });
    var avg = sum / n, lvl = Math.min(avg / GAUGE_MAX, 1), ang = -90 + lvl * 180;
    function arc(a0, a1, col) {
      var r = 120, cx = 150, cy = 150, f = function (a) { var t = (a - 180) * Math.PI / 180; return [cx + r * Math.cos(t), cy + r * Math.sin(t)]; };
      var p0 = f(a0), p1 = f(a1);
      return '<path d="M' + p0[0].toFixed(1) + ' ' + p0[1].toFixed(1) + ' A120 120 0 0 1 ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + '" fill="none" stroke="' + col + '" stroke-width="22"/>';
    }
    var zones = arc(0, 44, '#c8ff2e') + arc(46, 89, '#ffd21f') + arc(91, 134, '#ff2e97') + arc(136, 180, '#ff4b4b');
    return '<div class="card gauge"><svg viewBox="0 0 300 175" role="img" aria-label="Nivel de la fiesta">' + zones +
      '<g class="needle" style="transform:rotate(' + ang.toFixed(1) + 'deg)"><path d="M150 150 L146 60 L150 40 L154 60 Z" fill="#fff6ff"/></g><circle cx="150" cy="150" r="10" fill="#fff6ff"/>' +

      var ig = p.ig ? '<a class="ig" href="https://www.instagram.com/' + encodeURIComponent(p.ig) + '/" target="_blank" rel="noopener noreferrer">📸 @' + esc(p.ig) + '</a>' : '';
      return '<div class="rk' + (p.id === S.prof.pid ? ' me' : '') + '"><div class="pos">' + (i + 1) + '</div><div class="av">' + avi(p) + '</div>' +
        '<div class="mid"><div class="nm">' + esc(p.name) + (p.id === S.prof.pid ? '<span class="tg">TÚ</span>' : '') + '</div><div class="lb">' + esc(levelOf(t)) + '</div>' +
        '<div class="bar"><i style="width:' + Math.round(t / max * 100) + '%"></i></div><div class="brk">' + (brk || 'Aún nada') + '</div>' + ig + '</div><div class="tot">' + t + '</div></div>';
    }).join('');
    var host = !S.d.host || S.d.host === S.prof.pid;
    var fin = S.d.finished ? '<div class="card"><h2>🏁 Fiesta terminada</h2><button class="btn" data-act="wopen">🎬 Ver el Wrapped</button></div>'
      : host ? '<div class="card"><h2>🏁 ¿Se acabó?</h2><div class="note">Cierra la fiesta para todos y saca el Wrapped con premios para cada uno.</div><button class="btn li" data-act="finish">' + (S.confirmFinish ? '¿Seguro? Pulsa otra vez' : 'Terminar fiesta y ver Wrapped') + '</button></div>'
      : '<div class="note" style="text-align:center">Cuando quien creó la fiesta la termine, saldrá el Wrapped para todos. 🎬</div>';
    return '<div class="card"><h2>🏆 Ranking</h2>' + pod + '<div class="rows">' + rows + '</div><div class="note">Toca el Instagram de cada uno para cotillear cómo va la fiesta.</div></div>' + fin;
  }
  function retoLine(r) { return '<b>' + esc(nm(r.from)) + '</b> ' + em(r.from) + ' → <b>' + esc(nm(r.to)) + '</b> ' + em(r.to) + ' · ' + (r.kind === 'chupito' ? '🥃 chupito' : '🍹 trago'); }
  function numGrid(range, act, extra, sel, cls) {
    var cols = range === 10 ? 5 : range, h = '<div class="nums" style="grid-template-columns:repeat(' + cols + ',1fr)">';
    for (var i = 1; i <= range; i++) h += '<button class="num ' + (cls || '') + '" data-act="' + act + '" data-n="' + i + '" ' + (extra || '') + ' aria-pressed="' + (sel === i) + '">' + i + '</button>';
    return h + '</div>';
  }
  function retosView() {
    var myId = S.prof.pid, others = players().filter(function (p) { return p.id !== myId; }), out = '';
    retos().forEach(function (r) {
      if (r.to === myId && r.status === 'pending')
        out += '<div class="reto hot"><div class="h"><b>' + esc(nm(r.from)) + '</b> ' + em(r.from) + ' te reta a un <b>' + (r.kind === 'chupito' ? 'chupito 🥃' : 'trago 🍹') + '</b></div><div class="note">Elige un número del 1 al ' + r.range + '. Si coincide con el suyo, bebes.</div>' + numGrid(r.range, 'answer', 'data-id="' + r.id + '"', 0, 'big2') + '</div>';
    });
    retos().forEach(function (r) {
      if (r.to === myId && r.status === 'resolved' && r.match && !r.paid)
        out += '<div class="reto hot"><div class="verdict lose">¡Coincidencia! Te toca ' + (r.kind === 'chupito' ? 'un chupito 🥃' : 'un trago 🍹') + '</div><div class="h">' + retoLine(r) + '</div><button class="btn li" data-act="pay" data-id="' + r.id + '">Ya me lo he bebido (+1)</button></div>';
    });
    retos().forEach(function (r) {
      if (r.from === myId && r.status === 'pending')
        out += '<div class="reto"><div class="h">' + retoLine(r) + '</div><div class="note">Esperando a que elija su número… ⏳ Tú has elegido el ' + r.fromPick + ' (de 1 a ' + r.range + ').</div></div>';
    });
    var who = others.map(function (p) { return '<button class="wc" data-act="to" data-id="' + p.id + '" aria-pressed="' + (S.reto.to === p.id) + '"><span class="e">' + avi(p) + '</span><span class="t">' + esc(p.name) + '</span></button>'; }).join('');
    var ready = S.reto.to && S.reto.pick;
    var form = '<div class="card"><h2>🎲 Lanza un reto</h2>' + (others.length ?
      '<div><div class="note" style="margin-bottom:8px">1. ¿A quién?</div><div class="who">' + who + '</div></div>' +
      '<div><div class="note" style="margin-bottom:8px">2. ¿Qué se juega?</div><div class="seg"><button class="chip" data-act="kind" data-v="trago" aria-pressed="' + (S.reto.kind === 'trago') + '">🍹 Un trago</button><button class="chip" data-act="kind" data-v="chupito" aria-pressed="' + (S.reto.kind === 'chupito') + '">🥃 Un chupito</button></div></div>' +
      '<div><div class="note" style="margin-bottom:8px">3. Elige tu número del 1 al 10, en secreto</div>' + numGrid(10, 'pick', '', S.reto.pick) + '</div>' +
      '<button class="btn" data-act="send"' + (ready ? '' : ' disabled') + '>Lanzar reto 🚀</button>'
      : '<div class="empty"><span class="e">🎉</span>Aún estás solo. Invita a tus amigos desde la pestaña Fiesta para poder retarles.</div>') + '</div>';
    var hist = retos().filter(function (r) { return r.status === 'resolved'; }).slice(0, 12).map(function (r) {
      return '<div class="reto"><div class="h">' + retoLine(r) + '</div><div class="picks"><span class="pk">' + esc(nm(r.from)) + ': ' + r.fromPick + '</span><span class="pk">' + esc(nm(r.to)) + ': ' + r.toPick + '</span></div>' +
        (r.match ? '<div class="verdict lose">¡Coinciden! ' + esc(nm(r.to)) + ' bebe' + (r.paid ? ' ✅' : '') + '</div>' : '<div class="verdict win">No coinciden. ' + esc(nm(r.to)) + ' se libra</div>') + '</div>';
    }).join('');
    return (out ? '<div class="card"><h2>⚡ Ahora mismo</h2>' + out + '</div>' : '') + form + '<div class="card"><h2>📜 Historial</h2>' + (hist || '<div class="empty"><span class="e">🎲</span>Todavía no hay retos resueltos.</div>') + '</div>';
  }
  function inviteText() { return '🎉 Entra a mi fiesta «' + S.d.name + '» en Copómetro (código ' + S.code + ') y a ver quién aguanta más: ' + link(); }
  function invite() {
    var text = inviteText(), fallback = function () { window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank'); };
    if (navigator.share) navigator.share({ title: 'Copómetro', text: text }).catch(function (e) { if (!e || e.name !== 'AbortError') fallback(); });
    else fallback();
  }
  function fiestaView() {
    var ps = players().slice().sort(function (a, b) { return a.joined - b.joined; }), hostId = S.d.host;
    var head = '<div class="card"><h2>🎉 ' + esc(S.d.name) + '</h2><div class="row"><span class="codepill">' + esc(S.code) + '</span><span class="note">' + ps.length + (ps.length === 1 ? ' persona' : ' personas') + ' en la fiesta</span></div>' +
      '<div class="note" style="overflow-wrap:anywhere">' + esc(link()) + '</div>' +
      '<button class="btn wa" data-act="invite">📤 Invitar: elige el chat</button>' +
      '<div class="seg"><button class="ghost" data-act="qr">📱 Enseñar QR</button><button class="ghost" data-act="copy">📋 Copiar enlace</button></div></div>';
    var music = '<div class="card"><h2>🎵 Música de la fiesta</h2>' +
      (S.d.music ? '<a class="btn cy" href="' + esc(S.d.music) + '" target="_blank" rel="noopener">🎧 Abrir la música</a>' : '<div class="note">Todavía no hay música compartida.</div>') +
      '<div class="note">Crea un Jam en Spotify (Reproduciendo → Jam) o una lista colaborativa, copia el enlace y pégalo aquí. Todos lo verán en esta pestaña.</div>' +
      '<label class="f" for="in-music">Enlace de Spotify, YouTube, Apple Music…<input id="in-music" type="text" placeholder="https://open.spotify.com/…" autocomplete="off" autocapitalize="none"></label>' +
      '<div class="seg"><button class="ghost" data-act="savemusic">Guardar enlace</button>' + (S.d.music ? '<button class="ghost" data-act="clearmusic">Quitar</button>' : '') + '</div></div>';
    var rows = ps.map(function (p) {
      var t = total(p.drinks), brk = KINDS.filter(function (k) { return p.drinks[k.k]; }).map(function (k) { return k.e + p.drinks[k.k]; }).join(' ');
      var ig = p.ig ? '<a class="ig" href="https://www.instagram.com/' + encodeURIComponent(p.ig) + '/" target="_blank" rel="noopener noreferrer">📸 @' + esc(p.ig) + '</a>' : '';
      var hora = p.joined ? new Date(p.joined).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) : '';
      return '<div class="pp' + (p.id === S.prof.pid ? ' me' : '') + '"><div class="av">' + avi(p) + '</div><div class="mid"><div class="nm">' + esc(p.name) + (p.id === S.prof.pid ? '<span class="tg">TÚ</span>' : '') + (p.id === hostId ? '<span class="tg host">👑 ANFITRIÓN</span>' : '') + '</div>' +
        '<div class="lb">' + esc(levelOf(t)) + ' · ' + t + (t === 1 ? ' trago' : ' tragos') + '</div><div class="brk">' + (brk || 'Aún nada') + '</div><div class="brk">Entró a las ' + hora + '</div>' + ig + '</div></div>';
    }).join('');
    return head + music + '<div class="card"><h2>👥 Quién está</h2><div class="rows">' + rows + '</div></div>' +
      '<div class="card"><div class="seg"><button class="ghost" data-act="edit">✏️ Mis datos y foto</button><button class="ghost" data-act="leave">Salir de la fiesta</button></div></div>';
  }
  function partyView() {
    var pend = retos().filter(function (r) { return r.to === S.prof.pid && (r.status === 'pending' || (r.status === 'resolved' && r.match && !r.paid)); }).length;
    var body = S.tab === 'rank' ? rankView() : S.tab === 'retos' ? retosView() : S.tab === 'fiesta' ? fiestaView() : beberView();
    var tabs = [['beber', '🍹', 'Beber'], ['rank', '🏆', 'Ranking'], ['retos', '🎲', 'Retos'], ['fiesta', '🎉', 'Fiesta']];
    $app.innerHTML =
      body +
      '<div class="note center">Solo mayores de 18. Bebe con cabeza. <a href="#" data-act="privacy">Privacidad</a></div>' +
      '<nav><div class="in" role="tablist">' + tabs.map(function (t) {
        return '<button role="tab" data-act="tab" data-v="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '"><span class="i">' + t[1] + '</span>' + t[2] + (t[0] === 'retos' && pend ? '<span class="badge">' + pend + '</span>' : '') + '</button>';
      }).join('') + '</div></nav>';
  }
  function render() {
    if (S.view !== 'party' || !S.d) return;
    if (S.d.finished !== S.lastFinished) {
      var first = S.lastFinished === null; S.lastFinished = S.d.finished;
      if (S.d.finished) { S.wrap = { open: true, i: 0, c: -1 }; if (!first) toast('🏁 ¡La fiesta ha terminado! Mira el Wrapped'); }
      else S.wrap.open = false;
    }
    var y = window.scrollY;
    if (S.d.finished && S.wrap.open) { $app.innerHTML = wrappedView(); window.scrollTo(0, 0); }
    else { partyView(); window.scrollTo(0, y); }
  }

  /* ---------- events ---------- */
  $app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.dataset.act, v = b.dataset.v;
    if (b.tagName === 'A' && b.getAttribute('href') === '#') e.preventDefault();
    if (a === 'privacy') privacyModal();
    else if (a === 'invite') invite();
    else if (a === 'savemusic') { var mi = document.getElementById('in-music'); if (!mi || !mi.value.trim()) return toast('Pega primero un enlace'); act('music', { pid: S.prof.pid, url: mi.value.trim() }, '🎵 Música guardada'); }
    else if (a === 'clearmusic') act('music', { pid: S.prof.pid, url: '' }, 'Música quitada');
    else if (a === 'qr') qrModal();
    else if (a === 'rmphoto') { S.prof.photo = ''; S.prof.removePhoto = true; save({ prof: S.prof }); refreshPhoto(); }
    else if (a === 'wstory') { var slw = wrappedSlides(); shareStory(slw[Math.min(S.wrap.i, slw.length - 1)]); }
    else if (a === 'emoji') { S.prof.emoji = v; save({ prof: S.prof }); $app.querySelectorAll('.emo').forEach(function (x) { x.setAttribute('aria-pressed', x.dataset.v === v); }); }
    else if (a === 'create') createParty();
    else if (a === 'joincode') { readProf(); var pe = profError(); if (pe) return setErr(pe); var c = document.getElementById('in-code').value.trim().toUpperCase(); if (!/^[A-Z]{4}$/.test(c)) return setErr('El código son 4 letras.'); joinCode(c); }
    else if (a === 'acceptinvite') { readProf(); var pe2 = profError(); if (pe2) return setErr(pe2); joinCode(S.inviteCode); }
    else if (a === 'resume') { if (profError()) return toast('Completa tu perfil primero'); joinCode(S.last.code); }
    else if (a === 'edit') editView();
    else if (a === 'cancel') { S.view = 'party'; render(); }
    else if (a === 'saveprof') { readProf(); var pe3 = profError(); if (pe3) return setErr(pe3); S.view = 'party'; act('join', profBody({}), 'Datos guardados'); }
    else if (a === 'tab') { S.tab = v; render(); window.scrollTo(0, 0); }
    else if (a === 'add') addDrink(b.dataset.k, 1);
    else if (a === 'sub') addDrink(b.dataset.k, -1);
    else if (a === 'to') { S.reto.to = b.dataset.id; render(); }
    else if (a === 'kind') { S.reto.kind = v; render(); }
    else if (a === 'range') { S.reto.range = +v; S.reto.pick = 0; render(); }
    else if (a === 'pick') { S.reto.pick = +b.dataset.n; render(); }
    else if (a === 'send') sendReto();
    else if (a === 'answer') act('answer', { pid: S.prof.pid, id: b.dataset.id, pick: +b.dataset.n });
    else if (a === 'pay') act('pay', { pid: S.prof.pid, id: b.dataset.id }, 'Bebido y apuntado. Salud 🍻');
    else if (a === 'leave') leave();
    else if (a === 'wnext') { S.wrap.i++; render(); }
    else if (a === 'wprev') { S.wrap.i = Math.max(0, S.wrap.i - 1); render(); }
    else if (a === 'wrestart') { S.wrap.i = 0; S.wrap.c = -1; render(); }
    else if (a === 'wclose') { S.wrap.open = false; render(); }
    else if (a === 'wopen') { S.wrap = { open: true, i: 0, c: -1 }; render(); }
    else if (a === 'reopen') act('reopen', { pid: S.prof.pid }, 'Fiesta reabierta');
    else if (a === 'finish') {
      if (!S.confirmFinish) { S.confirmFinish = true; render(); clearTimeout(S.cf); S.cf = setTimeout(function () { S.confirmFinish = false; render(); }, 5000); }
      else { S.confirmFinish = false; act('finish', { pid: S.prof.pid }); }
    }
    else if (a === 'copy') {
      var ok = function () { toast('Enlace copiado: ' + link()); }, ko = function () { toast('Enlace: ' + link()); };
      try { navigator.clipboard.writeText(link()).then(ok, ko); } catch (x) { ko(); }
    }
  });
  $app.addEventListener('change', function (e) { if ((e.target.id === 'in-cam' || e.target.id === 'in-gal') && e.target.files) handlePhoto(e.target.files[0]); });
  $app.addEventListener('input', function (e) { if (e.target.id === 'in-code') e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, ''); });

  /* ---------- boot ---------- */
  async function boot() {
    var saved = load();
    if (saved.prof) S.prof = Object.assign(S.prof, saved.prof);
    if (!S.prof.pid) { S.prof.pid = 'p' + rid(11); save({ prof: S.prof }); }
    var m = location.pathname.match(/^\/([A-Za-z]{4})\/?$/);
    var code = m ? m[1].toUpperCase() : '';
    if (code) {
      S.inviteCode = code;
      try {
        var v = await api('p/' + code + '?pid=' + encodeURIComponent(S.prof.pid));
        S.inviteName = v.name;
        if (S.prof.name) return joinCode(code);
        return inviteView();
      } catch (e) { S.err = 'Esa fiesta no existe o el enlace está mal escrito.'; }
    }
    if (saved.last) {
      try { await api('p/' + saved.last.code); S.last = saved.last; } catch (e) { S.last = null; }
    }
    homeView();
  }
  boot();
})();
</script>
</body>
</html>
